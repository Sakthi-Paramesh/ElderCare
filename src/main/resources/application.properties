spring.application.name=eldercare-connect

# Server Configuration
server.port=8080

# Database Configuration - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/eldercare_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sakthi123
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# H2 Web Console (Disabled for MySQL)
spring.h2.console.enabled=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Secret Key (256-bit secure key)
jwt.secret=ElderCareConnectSuperSecretKeyForJwtAuthentication999
jwt.expiration=86400000

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always

# Static Resource Handling for Web Frontend
spring.web.resources.static-locations=classpath:/static/
